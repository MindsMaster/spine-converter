[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spine-converter"
version = "1.1.0"
description = "Convert Spine skeleton data between every version from 3.5 to 4.3"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "an5w1r", email = "an5w1r@163.com" }]
license-files = ["LICENSE", "LICENSE-MIT"]
keywords = ["spine", "esotericsoftware", "skeleton", "converter"]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MindsMaster/spine-converter"
Documentation = "https://github.com/MindsMaster/spine-converter/tree/main/bindings/python#readme"
Issues = "https://github.com/MindsMaster/spine-converter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/spine_converter"]
artifacts = ["src/spine_converter/*.dll", "src/spine_converter/*.dylib", "src/spine_converter/*.so", "LICENSE", "LICENSE-MIT"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
