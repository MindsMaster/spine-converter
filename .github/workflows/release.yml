name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: for rid in ios-arm64 iossimulator-arm64 iossimulator-x64; do zig build dist godot -Drid=$rid -Dcommit="${GITHUB_SHA::12}"; done
      - run: tools/ios_xcframework.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: |
            zig-out/dist
            zig-out/godot
            zig-out/ios

  package:
    needs: ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: bindings/js/package.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python -m pip install build
      - uses: actions/download-artifact@v8
        with:
          name: ios
          path: zig-out

      - name: Tag matches the version
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#v}" = "$(tools/versions.sh)"
      - run: zig build test
      - run: tools/package.sh "${GITHUB_SHA::12}" "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
