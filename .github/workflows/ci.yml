name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: bindings/js/package.json
      # the oldest supported Python, Windows keeps the image one
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: "3.10"

      - run: tools/versions.sh
      - run: zig fmt --check src cli tests oracle bindings/godot/src build.zig
      - name: Runtime identifier
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) rid=linux-x64 ;;
            Linux-ARM64) rid=linux-arm64 ;;
            Windows-X64) rid=win-x64 ;;
            Windows-ARM64) rid=win-arm64 ;;
            macOS-X64) rid=osx-x64 ;;
            macOS-ARM64) rid=osx-arm64 ;;
          esac
          echo "RID=$rid" >>"$GITHUB_ENV"
      - run: zig build test
      - run: zig build dist wasm -Drid="$RID"

      - name: C# binding
        run: dotnet run --project bindings/csharp/Tests
      - name: Python binding
        run: |
          SPINE_CONVERTER_LIBRARY=$(ls zig-out/dist/$RID/*) PYTHONPATH=bindings/python/src \
            python -m unittest discover -s bindings/python/tests
      - name: JavaScript binding
        working-directory: bindings/js
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm test
      - name: Godot extension
        if: runner.os == 'Linux'
        run: |
          zig build godot -Drid="$RID"
          python tools/godot_package.py "$RUNNER_TEMP/godot.zip" linux.x86_64
          # the oldest supported and the newest tested release
          for version in 4.3 4.7.2; do
            curl -fsSL -o "$RUNNER_TEMP/godot-$version.zip" \
              "https://github.com/godotengine/godot/releases/download/$version-stable/Godot_v$version-stable_linux.x86_64.zip"
            python -m zipfile -e "$RUNNER_TEMP/godot-$version.zip" "$RUNNER_TEMP/godot-$version"
            chmod +x "$RUNNER_TEMP/godot-$version/Godot_v$version-stable_linux.x86_64"
            bindings/godot/tests/run.sh "$RUNNER_TEMP/godot-$version/Godot_v$version-stable_linux.x86_64" "$RUNNER_TEMP/godot.zip"
          done

  android:
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported and the newest release, Godot 4.7 needs API 24
        include:
          - api: 21
            godot: "4.3"
          - api: 36
            godot: "4.3 4.7.2"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - run: |
          zig build dist -Drid=android-arm64 -Dandroid-ndk="$ANDROID_NDK_HOME"
          zig build dist -Drid=android-x64 -Dandroid-ndk="$ANDROID_NDK_HOME"
      - name: Godot test APK
        run: |
          zig build godot -Drid=android-arm64 -Dandroid-ndk="$ANDROID_NDK_HOME"
          zig build godot -Drid=android-x64 -Dandroid-ndk="$ANDROID_NDK_HOME"
          zig build godot -Drid=linux-x64
          # the exporting editor loads the extension too
          python tools/godot_package.py "$RUNNER_TEMP/godot.zip" linux.x86_64 android.arm64 android.x86_64
          for version in ${{ matrix.godot }}; do
            base=https://github.com/godotengine/godot/releases/download/$version-stable
            curl -fsSL -o "$RUNNER_TEMP/godot-$version.zip" "$base/Godot_v$version-stable_linux.x86_64.zip"
            python -m zipfile -e "$RUNNER_TEMP/godot-$version.zip" "$RUNNER_TEMP/godot-$version"
            chmod +x "$RUNNER_TEMP/godot-$version/Godot_v$version-stable_linux.x86_64"
            curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v$version-stable_export_templates.tpz"
            templates=~/.local/share/godot/export_templates/$version.stable
            mkdir -p "$templates"
            unzip -j -o "$RUNNER_TEMP/templates.tpz" templates/android_debug.apk templates/version.txt -d "$templates"
            rm "$RUNNER_TEMP/templates.tpz"
            bindings/godot/tests/export_android.sh "$RUNNER_TEMP/godot-$version/Godot_v$version-stable_linux.x86_64" \
              "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot-$version.apk"
          done
      - name: 16 KB pages
        run: |
          for so in zig-out/dist/android-*/*.so zig-out/godot/android.*/*.so; do
            readelf -lW "$so" | awk '$1 == "LOAD" && $NF != "0x4000" { bad = 1 } END { exit bad }'
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          # default data partition exceeds the runner disk
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            tests/android.sh "$ANDROID_NDK_HOME"
            for v in ${{ matrix.godot }}; do bindings/godot/tests/android.sh "$RUNNER_TEMP/godot-$v.apk" || exit 1; done

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - run: for rid in ios-arm64 iossimulator-arm64 iossimulator-x64; do zig build dist -Drid=$rid; done
      - name: Minimum iOS
        run: |
          for lib in ios-arm64:12.0 iossimulator-arm64:14.0 iossimulator-x64:12.0; do
            minos=$(otool -l "zig-out/dist/${lib%:*}/libspine_converter.a" | awk '$1 == "minos" { print $2 }' | sort -u)
            test "$minos" = "${lib#*:}" || { echo "$lib minos $minos"; exit 1; }
          done
      - name: Godot test apps
        run: |
          for rid in osx-arm64 osx-x64 ios-arm64 iossimulator-arm64 iossimulator-x64; do zig build godot -Drid=$rid; done
          # the exporting editor loads the extension too
          python3 tools/godot_package.py "$RUNNER_TEMP/godot.zip" macos ios
          for version in 4.3 4.7.2; do
            base=https://github.com/godotengine/godot/releases/download/$version-stable
            curl -fsSL -o "$RUNNER_TEMP/godot-$version.zip" "$base/Godot_v$version-stable_macos.universal.zip"
            unzip -q "$RUNNER_TEMP/godot-$version.zip" -d "$RUNNER_TEMP/godot-$version"
            curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v$version-stable_export_templates.tpz"
            templates="$HOME/Library/Application Support/Godot/export_templates/$version.stable"
            mkdir -p "$templates"
            unzip -j -o "$RUNNER_TEMP/templates.tpz" templates/ios.zip templates/version.txt -d "$templates"
            rm "$RUNNER_TEMP/templates.tpz"
            bindings/godot/tests/export_ios.sh "$RUNNER_TEMP/godot-$version/Godot.app/Contents/MacOS/Godot" \
              "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot-$version.app"
          done
      - name: Simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime in sorted(devices, reverse=True) if "iOS" in runtime for d in devices[runtime] if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$udid" -b
          tests/ios.sh
          for v in 4.3 4.7.2; do bindings/godot/tests/ios.sh "$RUNNER_TEMP/godot-$v.app"; done
